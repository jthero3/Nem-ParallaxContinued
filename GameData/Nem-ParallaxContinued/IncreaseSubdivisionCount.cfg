@Kopernicus:AFTER[Nem]:NEEDS[Parallax_StockScatterTextures]
{
    @Body[Nem]
    {
        %cacheFile = ParallaxContinued/Models/ScaledMesh.bin
        %PQS
        {
            %Mods
            {
                Parallax
                {
                    subdivisionLevel = 8
                    subdivisionRadius = 650
                    order = 999999
                }
            }
        }
        %Debug
        {
            %exportMesh = True
            %update = True
        }
    }
}